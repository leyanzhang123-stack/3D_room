<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>The Room</title>
<style>
  :root {
    --bg-top: #E9D3C6;
    --bg-bottom: #C9A493;
    --ink: #3B2620;
    --paper: #FBF6EF;
    --accent: #6B1E24;
    --wall: #EFE3D3;
    --wall-line: #DCCAB5;
    --cream: #F6EEE4;
    --cherry: #8E4A32;
    --walnut: #5A3426;
    --oxblood: #6B1E24;
    --brass: #C9A06A;
    --glow: #FFD39C;
    --u: min(1vh, 1.15vw);
    color-scheme: light;
  }
  @media (max-aspect-ratio: 3/4) { :root { --u: min(1vh, 1.5vw); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 50% 35%, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    font: 400 15px/1.45 "Iowan Old Style", Georgia, serif;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }

  /* ---------------- front door ---------------- */
  #porch { position: fixed; inset: 0; z-index: 30; overflow: hidden; background: var(--wall); transition: opacity .9s ease; }
  #porch.gone { opacity: 0; pointer-events: none; }
  .stage { position: absolute; inset: 0; transition: transform 1.3s cubic-bezier(.6, 0, .3, 1), opacity 1.1s ease .2s; }
  #porch.zoom .stage { transform: scale(3.4); opacity: 0; }
  .wall {
    position: absolute; inset: 0 0 30vh 0;
    background:
      radial-gradient(60% 70% at 50% 62%, rgba(255, 214, 160, .38), transparent 70%),
      repeating-linear-gradient(to bottom, var(--wall) 0, var(--wall) calc(var(--u) * 5.4), var(--wall-line) calc(var(--u) * 5.4), #E8DAC8 calc(var(--u) * 5.75));
  }
  .wall::after { content: ""; position: absolute; inset: 0; background: radial-gradient(140% 100% at 50% 70%, transparent 55%, rgba(59, 38, 32, .28)); }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; background: #6B3C2A; perspective: 40vh; perspective-origin: 50% 0; overflow: hidden; }
  .floor::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 1.2); background: var(--cherry); z-index: 2; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
  .boards { position: absolute; left: -60%; right: -60%; top: 0; height: 200%; transform-origin: 50% 0; transform: rotateX(62deg);
    background: repeating-linear-gradient(90deg, #7E4A35 0, #7E4A35 calc(var(--u) * 7.6), #5E3424 calc(var(--u) * 7.6), #5E3424 calc(var(--u) * 7.85)); }
  .floor::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(40, 20, 12, .35), rgba(40, 20, 12, 0) 40%, rgba(40, 20, 12, .3)); }

  .entry { position: absolute; left: 50%; bottom: 30vh; width: calc(var(--u) * 84); height: calc(var(--u) * 60); transform: translateX(-50%); }
  .arch {
    position: absolute; left: 50%; bottom: 0; width: calc(var(--u) * 32); height: calc(var(--u) * 52); transform: translateX(-50%);
    background: linear-gradient(160deg, #FBF5EC, #E9DCCB); border-radius: calc(var(--u) * 16) calc(var(--u) * 16) calc(var(--u) * .5) calc(var(--u) * .5);
    box-shadow: 0 0 0 calc(var(--u) * .5) #D8C6B0, 0 calc(var(--u) * 1.4) calc(var(--u) * 3) rgba(59, 38, 32, .35), inset 0 0 0 calc(var(--u) * .4) rgba(142, 74, 50, .25);
    perspective: calc(var(--u) * 140);
  }
  .arch::before { /* snow resting on top of the arch */
    content: ""; position: absolute; left: 12%; right: 12%; top: calc(var(--u) * -1.1); height: calc(var(--u) * 2.4);
    background: radial-gradient(60% 100% at 50% 100%, #fff 60%, rgba(255, 255, 255, 0) 62%); filter: blur(.4px);
  }
  .doorway, .door { position: absolute; left: calc(var(--u) * 2.4); right: calc(var(--u) * 2.4); top: calc(var(--u) * 2.4); bottom: 0; border-radius: calc(var(--u) * 13.6) calc(var(--u) * 13.6) 0 0; }
  .doorway { background: radial-gradient(70% 60% at 50% 55%, #FFF1D8, #FFC98A 45%, #C9733F 80%, #7A3A28); transition: filter 1.2s; }
  #porch.opening .doorway { filter: brightness(1.25); }
  .door {
    border: 0; padding: 0; cursor: pointer; transform-origin: 0 50%; transition: transform 1.3s cubic-bezier(.5, 0, .2, 1);
    background:
      repeating-linear-gradient(90deg, rgba(0, 0, 0, .05) 0, rgba(0, 0, 0, .05) 2px, transparent 2px, transparent calc(var(--u) * 1.6)),
      linear-gradient(100deg, #7A2A2F, var(--oxblood) 55%, #561519);
    box-shadow: inset 0 0 0 calc(var(--u) * .35) rgba(255, 255, 255, .06), inset calc(var(--u) * -1) 0 calc(var(--u) * 2) rgba(0, 0, 0, .25);
    transform: rotateY(-7deg);
  }
  .door:focus-visible { outline: 3px solid var(--glow); outline-offset: 4px; }
  #porch.opening .door { transform: rotateY(-78deg); }
  .door > span { position: absolute; left: 50%; transform: translateX(-50%); }
  .win { top: calc(var(--u) * 3.6); width: calc(var(--u) * 16); height: calc(var(--u) * 9.6); border-radius: calc(var(--u) * 8) calc(var(--u) * 8) calc(var(--u) * .4) calc(var(--u) * .4);
    background: radial-gradient(80% 90% at 50% 80%, #FFE7C2, #F4B979); box-shadow: 0 0 0 calc(var(--u) * .7) #4E1418, 0 0 calc(var(--u) * 4) rgba(255, 200, 130, .45); overflow: hidden; }
  .win i { position: absolute; background: #4E1418; }
  .win i:first-child { left: 50%; top: 0; bottom: 0; width: calc(var(--u) * .6); transform: translateX(-50%); }
  .win i:last-child { top: 52%; left: 0; right: 0; height: calc(var(--u) * .6); }
  .wreath { top: calc(var(--u) * 15.4); width: calc(var(--u) * 9.4); height: calc(var(--u) * 9.4); }
  .wreath svg { width: 100%; height: 100%; display: block; }
  .nameplate { top: calc(var(--u) * 26.6); padding: calc(var(--u) * .9) calc(var(--u) * 2.6); border-radius: calc(var(--u) * .7); white-space: nowrap;
    background: linear-gradient(180deg, #E6C894, var(--brass) 55%, #A9824D); color: #3B2620; font: 600 calc(var(--u) * 2.5) / 1 "Iowan Old Style", Georgia, serif; letter-spacing: .04em;
    box-shadow: 0 calc(var(--u) * .3) calc(var(--u) * .6) rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .5); }
  .panel { top: calc(var(--u) * 33.5); width: calc(var(--u) * 19); height: calc(var(--u) * 9); border-radius: calc(var(--u) * .8);
    box-shadow: inset 0 0 0 calc(var(--u) * .45) rgba(0, 0, 0, .18), inset calc(var(--u) * .35) calc(var(--u) * .35) 0 calc(var(--u) * .45) rgba(255, 255, 255, .05); }
  .knob { left: auto !important; right: calc(var(--u) * 2.2); transform: none !important; top: calc(var(--u) * 30); width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #F3DDB0, var(--brass) 55%, #8C6A3C); box-shadow: 0 calc(var(--u) * .3) calc(var(--u) * .5) rgba(0, 0, 0, .45); }

  .lantern { position: absolute; top: calc(var(--u) * 15); width: calc(var(--u) * 3.8); height: calc(var(--u) * 6.6); border-radius: calc(var(--u) * .5);
    background: linear-gradient(#FFE5BC, #FFC27E); box-shadow: 0 0 0 calc(var(--u) * .55) #2E211D, 0 0 calc(var(--u) * 6) calc(var(--u) * 2) rgba(255, 196, 120, .45); animation: flick 3.2s infinite ease-in-out; }
  .lantern::before { content: ""; position: absolute; left: -25%; right: -25%; top: calc(var(--u) * -2.2); height: calc(var(--u) * 2); background: #2E211D; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .lantern::after { content: ""; position: absolute; left: -10%; right: -10%; top: calc(var(--u) * -2.9); height: calc(var(--u) * 1.2); background: radial-gradient(60% 100% at 50% 100%, #fff 60%, transparent 62%); }
  .lantern.left { left: calc(50% - var(--u) * 21.5); }
  .lantern.right { left: calc(50% + var(--u) * 17.7); animation-delay: -1.3s; }
  @keyframes flick { 0%, 100% { filter: brightness(1); } 45% { filter: brightness(.88); } 60% { filter: brightness(1.05); } }

  .plaque { position: absolute; top: calc(var(--u) * 6); left: calc(50% + var(--u) * 24); padding: calc(var(--u) * 1) calc(var(--u) * 1.8); transform: rotate(-3deg);
    background: var(--paper); color: var(--oxblood); font: italic calc(var(--u) * 2) / 1.1 "Iowan Old Style", Georgia, serif; white-space: nowrap;
    border-radius: calc(var(--u) * .4); box-shadow: 0 calc(var(--u) * .5) calc(var(--u) * 1.2) rgba(59, 38, 32, .3), inset 0 0 0 1px rgba(142, 74, 50, .25); }
  .plaque::before { content: ""; position: absolute; top: calc(var(--u) * -.5); left: 50%; width: calc(var(--u) * .9); height: calc(var(--u) * .9); border-radius: 50%; background: var(--brass); transform: translateX(-50%); }

  .spot { position: absolute; bottom: calc(var(--u) * -3); width: calc(var(--u) * 17); height: calc(var(--u) * 15); }
  .spot::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: calc(var(--u) * -.8); height: calc(var(--u) * 2.2); border-radius: 50%; background: rgba(40, 20, 12, .35); filter: blur(4px); }
  #spotL { left: calc(50% - var(--u) * 37); }
  #spotR { left: calc(50% + var(--u) * 20); }
  .mat { position: absolute; left: 50%; top: calc(100% + var(--u) * 1.2); width: calc(var(--u) * 27); height: calc(var(--u) * 5.2); transform: translateX(-50%) perspective(calc(var(--u) * 30)) rotateX(40deg);
    display: grid; place-items: center; background: repeating-linear-gradient(90deg, #B98F69 0, #B98F69 3px, #A87D58 3px, #A87D58 5px);
    border: calc(var(--u) * .6) solid #7A4F35; border-radius: calc(var(--u) * .4); color: #4E2E20; font: italic 600 calc(var(--u) * 2.1) / 1 "Iowan Old Style", Georgia, serif; letter-spacing: .03em;
    box-shadow: 0 calc(var(--u) * .6) calc(var(--u) * 1) rgba(0, 0, 0, .3); }
  #porchDogs { position: absolute; inset: 0; pointer-events: none; }
  #porchSnow { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .hint { position: absolute; left: 0; right: 0; bottom: max(5vh, env(safe-area-inset-bottom, 0px)); margin: 0; text-align: center; z-index: 4;
    color: var(--paper); font-style: italic; font-size: 16px; letter-spacing: .03em; text-shadow: 0 1px 6px rgba(0, 0, 0, .45); animation: pulse 2.4s infinite ease-in-out; }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  @media (max-aspect-ratio: 3/4) {
    .lantern.left { left: calc(50% - var(--u) * 21); }
    .lantern.right { left: calc(50% + var(--u) * 17.2); }
    .plaque { top: calc(var(--u) * -4); left: 50%; transform: translateX(-50%) rotate(-3deg); }
    #spotL { left: calc(50% - var(--u) * 31); }
    #spotR { left: calc(50% + var(--u) * 14); }
  }

  /* ---------------- inside the room ---------------- */
  #tip {
    position: fixed; pointer-events: none; z-index: 5;
    background: rgba(59, 38, 32, .82); color: var(--paper);
    padding: 5px 10px; border-radius: 999px; font-size: 13px;
    transform: translate(-50%, -140%); white-space: nowrap; opacity: 0; transition: opacity .15s;
  }
  #tip.on { opacity: 1; }

  #bubble {
    position: fixed; z-index: 6; max-width: min(280px, 72vw);
    background: var(--paper); color: var(--ink);
    padding: 10px 14px; border-radius: 16px;
    box-shadow: 0 8px 24px -10px rgba(59, 38, 32, .5);
    transform: translate(-50%, calc(-100% - 14px)); font-size: 14px;
    transition: opacity .3s;
  }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px;
    background: var(--paper); transform: translateX(-50%) rotate(45deg); border-radius: 3px;
  }
  #bubble.hidden { opacity: 0; pointer-events: none; }
  #bubble.floating::after { display: none; }

  #card {
    position: fixed; z-index: 10; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 160%); transition: transform .45s cubic-bezier(.2, .8, .2, 1);
    width: min(440px, calc(100vw - 32px));
    background: var(--paper); border-radius: 20px; padding: 18px 20px 16px;
    box-shadow: 0 18px 40px -16px rgba(59, 38, 32, .55);
  }
  #card.open { transform: translate(-50%, 0); }
  #card h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  #card p { margin: 0; color: #7a5d52; font-style: italic; }
  #card { max-height: calc(100vh - 36px); overflow-y: auto; }
  #cardBody { margin-top: 12px; }
  .list { display: grid; gap: 8px; }
  .track { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; border: 0; border-radius: 14px; background: #F3E9DF; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .track img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; }
  .track .meta { display: grid; flex: 1; min-width: 0; }
  .track .meta b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .meta small { color: #7a5d52; font-style: italic; }
  .track .state { flex: none; font-size: 13px; font-weight: 600; color: var(--accent); padding: 5px 10px; border-radius: 999px; border: 1.5px solid #E3CFC4; }
  .track.on { background: #EAD6CC; }
  .track.on .state { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  .track:focus-visible { outline: 3px solid #E3B9B0; outline-offset: 2px; }
  .gallery { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
  .gallery img { height: min(42vh, 340px); width: auto; max-width: 82vw; border-radius: 12px; object-fit: cover; scroll-snap-align: center; flex: none; }
  .swipe-hint { margin: 6px 0 0; font-size: 12px; color: #7a5d52; font-style: italic; }
  #cardActions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  #cardActions button {
    font: inherit; font-weight: 600; color: var(--accent); background: transparent;
    border: 2px solid #E3CFC4; border-radius: 999px; padding: 9px 16px; cursor: pointer;
  }
  #cardActions button.primary { color: var(--paper); background: var(--accent); border-color: var(--accent); }
  #cardActions button:focus-visible { outline: 3px solid #E3B9B0; outline-offset: 2px; }
  #meter { height: 6px; border-radius: 6px; background: #EADBD2; margin-top: 12px; overflow: hidden; }
  #meter i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 6px; transition: width .08s; }

  #zoomOut {
    position: fixed; z-index: 12; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; gap: 6px; padding: 9px 14px 9px 11px; border: 0; border-radius: 999px; cursor: pointer;
    background: rgba(251, 246, 239, .92); color: var(--accent); font: 600 14px/1 "Iowan Old Style", Georgia, serif;
    box-shadow: 0 6px 18px -8px rgba(59, 38, 32, .5);
  }
  #zoomOut svg { width: 18px; height: 18px; }
  #zoomOut:focus-visible { outline: 3px solid #E3B9B0; outline-offset: 2px; }
  #album { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; background: rgba(36, 20, 15, .94); color: var(--paper); }
  #album[hidden] { display: none; }
  #album header { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  .album-title { font-style: italic; font-size: 18px; }
  #albumCount { flex: 1; font-size: 13px; letter-spacing: .08em; opacity: .7; font-variant-numeric: tabular-nums; }
  #albumClose { font: inherit; font-weight: 600; color: var(--accent); background: var(--paper); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  #albumTrack { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior: contain; }
  #albumTrack::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; margin: 0; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 16px 28px; box-sizing: border-box; }
  .slide .pics { background: #FBF6EF; padding: 12px 12px 0; border-radius: 4px; box-shadow: 0 20px 40px -18px rgba(0, 0, 0, .7); display: flex; gap: 8px; max-width: min(92vw, 640px); }
  .slide .pics img { display: block; max-height: 58vh; max-width: 100%; min-width: 0; object-fit: contain; border-radius: 2px; background: #EFE6DB; }
  .slide .pics.n2 img, .slide .pics.n3 img { flex: 1; object-fit: cover; max-height: 46vh; }
  .slide figcaption { width: min(92vw, 640px); max-width: 100%; box-sizing: border-box; background: #FBF6EF; color: var(--ink); padding: 12px 18px 18px; border-radius: 0 0 4px 4px; text-align: center; box-shadow: 0 20px 40px -18px rgba(0, 0, 0, .7); }
  .slide figcaption small { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #9a7a6c; margin-bottom: 4px; }
  .slide figcaption span { font: italic 19px/1.35 "Segoe Print", "Bradley Hand", "Iowan Old Style", Georgia, serif; }
  .album-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(251, 246, 239, .9); color: var(--accent); font-size: 26px; line-height: 1; cursor: pointer; }
  .album-nav.prev { left: max(10px, env(safe-area-inset-left, 0px)); }
  .album-nav.next { right: max(10px, env(safe-area-inset-right, 0px)); }
  @media (pointer: coarse) { .album-nav { display: none; } }
  .deskphoto { margin: 0; text-align: center; }
  .deskphoto img { max-height: 44vh; max-width: 100%; border-radius: 10px; }
  .deskphoto figcaption { margin-top: 6px; font-style: italic; color: #7a5d52; }
  #credit {
    position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(6px, env(safe-area-inset-bottom, 0px));
    font-size: 10px; color: rgba(59, 38, 32, .55); z-index: 4;
  }
  #credit a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { .lantern, .hint { animation: none; } }
</style>

<body>
  <section id="porch" aria-label="Front door">
    <div class="stage" id="stage">
      <div class="wall"></div>
      <div class="floor"><div class="boards"></div></div>
      <div class="entry">
        <div class="lantern left"></div>
        <div class="lantern right"></div>
        <div class="plaque">Happy Birthday</div>
        <div class="arch">
          <div class="doorway"></div>
          <button id="door" class="door" type="button" aria-label="Open the door">
            <span class="win"><i></i><i></i></span>
            <span class="wreath" aria-hidden="true">
              <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="36" fill="none" stroke="#3F5A3A" stroke-width="12"/>
                <g fill="#5F7D52">
                  <ellipse cx="50" cy="14" rx="7" ry="4"/><ellipse cx="86" cy="50" rx="4" ry="7"/><ellipse cx="50" cy="86" rx="7" ry="4"/><ellipse cx="14" cy="50" rx="4" ry="7"/>
                  <ellipse cx="75" cy="25" rx="6" ry="4" transform="rotate(45 75 25)"/><ellipse cx="75" cy="75" rx="6" ry="4" transform="rotate(-45 75 75)"/>
                  <ellipse cx="25" cy="75" rx="6" ry="4" transform="rotate(45 25 75)"/><ellipse cx="25" cy="25" rx="6" ry="4" transform="rotate(-45 25 25)"/>
                </g>
                <g fill="#FFFFFF">
                  <ellipse cx="62" cy="16" rx="3" ry="4.5"/><ellipse cx="84" cy="36" rx="3" ry="4.5"/><ellipse cx="84" cy="64" rx="3" ry="4.5"/><ellipse cx="64" cy="84" rx="3" ry="4.5"/>
                  <ellipse cx="36" cy="84" rx="3" ry="4.5"/><ellipse cx="16" cy="64" rx="3" ry="4.5"/><ellipse cx="16" cy="36" rx="3" ry="4.5"/><ellipse cx="38" cy="16" rx="3" ry="4.5"/>
                </g>
                <path d="M50 78 l-7 12 l7 -4 l7 4 z" fill="#8E1F26"/><circle cx="50" cy="78" r="4" fill="#A3262D"/>
              </svg>
            </span>
            <span class="nameplate">Aida C.</span>
            <span class="panel"></span>
            <span class="knob"></span>
          </button>
        </div>
        <div class="spot" id="spotL"></div>
        <div class="spot" id="spotR"></div>
        <div class="mat">Happy Every Day</div>
      </div>
      <canvas id="porchDogs"></canvas>
    </div>
    <canvas id="porchSnow"></canvas>
    <p class="hint">Tap the door</p>
  </section>

  <button id="zoomOut" type="button" aria-label="Zoom out to see the whole room">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M7.5 10.5h6M15.5 15.5 20 20"/></svg>
    Zoom out
  </button>
  <div id="tip"></div>
  <div id="bubble" class="hidden"></div>
  <div id="card" role="dialog" aria-live="polite">
    <h2 id="cardTitle"></h2>
    <p id="cardText"></p>
    <div id="meter" hidden><i></i></div>
    <div id="cardBody" hidden></div>
    <div id="cardActions"></div>
  </div>
  <section id="album" hidden aria-label="Our album">
    <header>
      <span class="album-title">Our album</span>
      <span id="albumCount"></span>
      <button id="albumClose" type="button">Close</button>
    </header>
    <div id="albumTrack"></div>
    <button id="albumPrev" class="album-nav prev" type="button" aria-label="Previous photo">‹</button>
    <button id="albumNext" class="album-nav next" type="button" aria-label="Next photo">›</button>
  </section>
