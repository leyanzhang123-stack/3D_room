<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Room</title>
<style>
  :root {
    --bg-top: #E9D3C6;
    --bg-bottom: #C9A493;
    --ink: #3B2620;
    --paper: #FBF6EF;
    --accent: #6B1E24;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 50% 35%, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    font: 400 15px/1.45 "Iowan Old Style", Georgia, serif;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }

  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: inherit; transition: opacity .8s ease; z-index: 20;
    font-style: italic; letter-spacing: .02em;
  }
  #loading.gone { opacity: 0; pointer-events: none; }

  #tip {
    position: fixed; pointer-events: none; z-index: 5;
    background: rgba(59, 38, 32, .82); color: var(--paper);
    padding: 5px 10px; border-radius: 999px; font-size: 13px;
    transform: translate(-50%, -140%); white-space: nowrap; opacity: 0; transition: opacity .15s;
  }
  #tip.on { opacity: 1; }

  #bubble {
    position: fixed; z-index: 6; max-width: min(260px, 70vw);
    background: var(--paper); color: var(--ink);
    padding: 10px 14px; border-radius: 16px;
    box-shadow: 0 8px 24px -10px rgba(59, 38, 32, .5);
    transform: translate(-50%, calc(-100% - 14px)); font-size: 14px;
    transition: opacity .3s;
  }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px;
    background: var(--paper); transform: translateX(-50%) rotate(45deg); border-radius: 3px;
  }
  #bubble.hidden { opacity: 0; pointer-events: none; }

  #card {
    position: fixed; z-index: 10; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 140%); transition: transform .45s cubic-bezier(.2, .8, .2, 1);
    width: min(440px, calc(100vw - 32px));
    background: var(--paper); border-radius: 20px; padding: 18px 20px 16px;
    box-shadow: 0 18px 40px -16px rgba(59, 38, 32, .55);
  }
  #card.open { transform: translate(-50%, 0); }
  #card h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  #card p { margin: 0; color: #7a5d52; font-style: italic; }
  #card button {
    margin-top: 14px; font: inherit; font-weight: 600; color: var(--paper); background: var(--accent);
    border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
  }
  #card button:focus-visible { outline: 3px solid #E3B9B0; outline-offset: 2px; }

  #credit {
    position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(6px, env(safe-area-inset-bottom, 0px));
    font-size: 10px; color: rgba(59, 38, 32, .55); z-index: 4;
  }
  #credit a { color: inherit; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="loading">Opening the door…</div>
  <div id="tip"></div>
  <div id="bubble" class="hidden">Woof! I'm your guide today. Tap anything that sparkles.</div>
  <div id="card" role="dialog" aria-live="polite">
    <h2 id="cardTitle"></h2>
    <p id="cardText"></p>
    <button id="cardClose" type="button">Back to the room</button>
  </div>
  <div id="credit">Dog: “Bernese Mountain Dog Low Poly” by <a href="https://sketchfab.com/picklecobra" target="_blank" rel="noopener">toofball</a>, CC BY 4.0</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
